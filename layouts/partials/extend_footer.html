<script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {

    // ── Medium Zoom ──────────────────────────────────────────────────────────
    if (typeof mediumZoom === 'function') {
      mediumZoom('.post-content img', {
        background: 'rgba(0, 0, 0, 0.8)',
        margin: 24
      });
    }

    // ── Jekyll-style TOC scrollspy ───────────────────────────────────────────
    // PaperMod structure: details.toc > summary + div.inner > ul > li > a [> ul > li > a]
    // NO #TableOfContents id is generated by PaperMod.

    const tocInner = document.querySelector('.toc .inner');
    if (!tocInner) return;

    const headings = Array.from(
      document.querySelectorAll('.post-content h2, .post-content h3, .post-content h4')
    );
    if (headings.length === 0) return;

    // Top-level <li> in the TOC = H2 entries
    const topItems = Array.from(tocInner.querySelectorAll(':scope > ul > li'));

    // Hide all nested sub-lists (H3/H4) initially
    topItems.forEach(item => {
      const sub = item.querySelector(':scope > ul');
      if (sub) sub.style.display = 'none';
    });

    // ── Helpers ──────────────────────────────────────────────────────────────
    function getActiveHeading() {
      const scrollPos = window.scrollY + 150;
      let active = headings[0];
      for (const h of headings) {
        if (h.getBoundingClientRect().top + window.scrollY <= scrollPos) {
          active = h;
        } else {
          break;
        }
      }
      return active;
    }

    function getParentH2(heading) {
      if (heading.tagName === 'H2') return heading;
      const idx = headings.indexOf(heading);
      for (let i = idx - 1; i >= 0; i--) {
        if (headings[i].tagName === 'H2') return headings[i];
      }
      return null;
    }

    // ── Main update ──────────────────────────────────────────────────────────
    function updateTOC() {
      const active   = getActiveHeading();
      const activeH2 = getParentH2(active);

      topItems.forEach(item => {
        const h2Link = item.querySelector(':scope > a');
        const sub    = item.querySelector(':scope > ul');
        if (!h2Link) return;

        const h2Id = decodeURIComponent(h2Link.getAttribute('href').replace(/^#/, ''));
        const isCurrentSection = activeH2 && activeH2.id === h2Id;

        // Expand / collapse H3 sub-list
        if (sub) sub.style.display = isCurrentSection ? '' : 'none';

        // Highlight H2 link
        h2Link.classList.toggle('active', isCurrentSection);

        // Highlight H3/H4 links
        if (sub) {
          sub.querySelectorAll('a').forEach(link => {
            const id = decodeURIComponent(link.getAttribute('href').replace(/^#/, ''));
            link.classList.toggle('active', active.id === id);
          });
        }
      });
    }

    window.addEventListener('scroll', updateTOC, { passive: true });
    updateTOC();
  });
</script>
